  else cp.add(new THREE.LineCurve3(prev,b));}return cp;}
function ribbon(curve,w=0.34,th=0.07){const N=Math.max(80,Math.round(curve.getLength()*24));const pos=[],idx=[];const up=new THREE.Vector3(0,1,0);
 for(let i=0;i<=N;i++){const u=i/N,p=curve.getPointAt(u),t=curve.getTangentAt(u),s=new THREE.Vector3().crossVectors(t,up).normalize().multiplyScalar(w/2);
  const L=p.clone().add(s),R=p.clone().sub(s);pos.push(L.x,L.y+th,L.z,R.x,R.y+th,R.z,L.x,L.y,L.z,R.x,R.y,R.z);}
 for(let i=0;i<N;i++){const a=i*4,b=(i+1)*4;idx.push(a,b,a+1,a+1,b,b+1, a,a+2,b,b,a+2,b+2, a+1,b+1,a+3,a+3,b+1,b+3);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
 const m=new THREE.Mesh(g,M.orange);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
const routes=[
 [[-2.2,-2.8],[-0.9,-2.8],[-0.9,-3.6],[-0.8,-3.6]],          // req -> prof
 [[1.9,-3.6],[2.6,-3.6],[2.6,-1.7]],                         // prof -> pay

];

// story order: req->prof (0.4-1.6), prof->pay? we narrate: req->build (1.2-2.2), build->pay(2.4-3.6), pay->ath(3.8-4.8), prof->pay(1.6-2.8), build->prog(4.4-5.4), prog->ath(5.6-6.2)

 // camera: slow dolly + drift (like the reference)
 const u=ease(cl(t/8.2));

 story.forEach(([ci,a,b],k)=>{const x=P(t,a,b);const pu=pulses[k];pu.visible=x>0&&x<1;if(pu.visible){const p=curves[ci].getPointAt(ease(x));pu.position.set(p.x,p.y+0.2,p.z);}});

 // end card

 renderer.render(scene,cam);
}
