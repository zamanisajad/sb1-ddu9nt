<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:CT;src:url(CoachTitle.ttf)}
@font-face{font-family:CB;src:url(CoachBody.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F3F5F8}
#stage{position:absolute;inset:0;overflow:hidden;perspective:2200px;
  background:radial-gradient(90% 55% at 85% 8%,#FDDCC4 0%,rgba(253,220,196,0) 60%),
             radial-gradient(80% 45% at 5% 95%,#FCE3D2 0%,rgba(252,227,210,0) 60%),
             linear-gradient(180deg,#F7F8FA 0%,#EEF1F5 100%)}
#cam{position:absolute;inset:0;transform-origin:540px 960px;transform-style:preserve-3d}
.floor{position:absolute;left:-200px;right:-200px;top:1500px;height:900px;
  background:radial-gradient(60% 40% at 50% 0%,rgba(30,41,59,.07),rgba(30,41,59,0) 70%)}
.glass{position:absolute;border-radius:40px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.12));
  border:2px solid rgba(255,255,255,.7);box-shadow:0 30px 60px -30px rgba(30,41,59,.25);backdrop-filter:blur(6px)}
.phone{position:absolute;left:0;top:0;width:400px;height:820px;border-radius:64px;padding:14px;
  background:linear-gradient(160deg,#2A3447 0%,#161D2B 55%,#10161F 100%);
  box-shadow:0 70px 110px -40px rgba(16,22,31,.55),0 0 0 2px #39445A inset,0 2px 0 rgba(255,255,255,.12) inset;
  transform-origin:200px 410px}
.phone .scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;
  background:linear-gradient(180deg,#141C2A,#0E141F)}
.phone .notch{position:absolute;top:22px;left:50%;width:110px;height:30px;margin-left:-55px;border-radius:20px;background:#05080D;z-index:9}
.phone .shine{position:absolute;inset:0;border-radius:50px;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 35%);z-index:8}
.layer{position:absolute;inset:0;padding:78px 22px 24px}
.card{background:#1E2738;border-radius:26px;box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.bar{height:12px;border-radius:8px;background:#3A4559}
.bar.l{background:#55617A}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.row{display:flex;align-items:center;gap:16px}
.stars{display:flex;gap:4px}
.btn{border-radius:999px;background:linear-gradient(135deg,#F7975F,#F47B3B);display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 30px -10px rgba(244,123,59,.7)}
.ico{display:block}
.panel{position:absolute;border-radius:44px;background:rgba(24,32,48,.80);border:2px solid rgba(255,255,255,.14);
  box-shadow:0 60px 100px -40px rgba(16,22,31,.6),0 0 0 1px rgba(244,123,59,.06);backdrop-filter:blur(14px)}
.chip{border-radius:999px;background:#2A3448;color:#E9EDF5;font-family:CT;font-size:26px;padding:6px 18px;display:inline-block}
.ripple{position:absolute;border-radius:50%;border:4px solid rgba(255,255,255,.9);pointer-events:none}
svg#paths{position:absolute;inset:0;width:1080px;height:1920px;overflow:visible;pointer-events:none}
.badge{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.4)}
.coin{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFE2A8,#F2A33A 55%,#D9832A);box-shadow:0 0 30px rgba(244,163,58,.8);
  display:flex;align-items:center;justify-content:center}
#endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:300px;opacity:0}
#endcard .name{font-family:CT;font-size:120px;color:#1F1A17;line-height:1.2}
#endcard .tag{font-family:CB;font-weight:700;font-size:52px;color:#4A423D;margin-top:18px}
#endcard .tag b{color:#F47B3B}
#endcard .rule{width:120px;height:6px;border-radius:6px;background:#F47B3B;margin-top:34px}
</style></head><body>
<div id="stage">
  <div id="cam">
    <div class="floor"></div>
    <div class="glass" id="g1" style="width:420px;height:300px;left:-80px;top:180px"></div>
    <div class="glass" id="g2" style="width:300px;height:420px;left:820px;top:1180px"></div>
    <div class="glass" id="g3" style="width:240px;height:160px;left:640px;top:120px;border-radius:30px"></div>
    <svg id="paths"><defs>
      <linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="#F9B48C"/><stop offset=".5" stop-color="#F47B3B"/><stop offset="1" stop-color="#F46344"/></linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
      <radialGradient id="pg"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#FFD2B3"/><stop offset="1" stop-color="rgba(244,123,59,0)"/></radialGradient>
    </defs><g id="pathg"></g></svg>
    <div id="world"></div>
  </div>
  <div id="endcard"><div class="name" id="ecName"></div><div class="tag" id="ecTag"></div><div class="rule"></div></div>
</div>
<script>
// ---------- helpers ----------
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const ob=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function kf(keys,t){ // keys: [t, ...vals]
  if(t<=keys[0][0]) return keys[0].slice(1);
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];
    if(t<=b[0]){const x=io(P(t,a[0],b[0]));return a.slice(1).map((v,j)=>lerp(v,b[j+1],x));}}
  return keys[keys.length-1].slice(1);
}
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
// ---------- icons ----------
const I={
 user:(c='#fff',s=40)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.8-4.4 4.3-7 8.5-7s7.7 2.6 8.5 7z"/></svg>`,
 star:(c='#F2A33A',s=18)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M12 2.5l2.9 6.2 6.8.7-5.1 4.6 1.5 6.7L12 17.3 5.9 20.7l1.5-6.7L2.3 9.4l6.8-.7z"/></svg>`,
 send:(c='#fff',s=40)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M21 3L10 13"/></svg>`,
 check:(c='#fff',s=60)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
 x:(c='#fff',s=60)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
 target:(c='#F47B3B',s=44)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.6" fill="${c}"/></svg>`,
 bolt:(c='#F2A33A',s=44)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>`,
 heart:(c='#F46344',s=44)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M12 21s-8-5.1-8-11a4.6 4.6 0 0 1 8-3.1A4.6 4.6 0 0 1 20 10c0 5.9-8 11-8 11z"/></svg>`,
 cal:(c='#9FB3D9',s=44)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>`,
 scale:(c='#9FB3D9',s=44)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 9.5a4.5 4.5 0 0 1 7 0L12 12z" fill="${c}"/></svg>`,
 dumb:(c='#F47B3B',s=48)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><rect x="1.5" y="9" width="3" height="6" rx="1"/><rect x="4.5" y="7" width="3" height="10" rx="1"/><rect x="7.5" y="11" width="9" height="2"/><rect x="16.5" y="7" width="3" height="10" rx="1"/><rect x="19.5" y="9" width="3" height="6" rx="1"/></svg>`,
 run:(c='#F47B3B',s=48)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4.5" r="2" fill="${c}"/><path d="M6 20l3.5-5 3 2 1.5-5 3.5 3.5H20M9 9.5l3-2 2.5 2.5"/></svg>`,
 push:(c='#F47B3B',s=48)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><circle cx="19.5" cy="9" r="2" fill="${c}"/><path d="M3 15.5l14-4.5M17.5 11v6M2 19.5h20"/></svg>`,
 kettle:(c='#F47B3B',s=48)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M8 7a4 4 0 0 1 8 0v1h-2V7a2 2 0 0 0-4 0v1H8z"/><circle cx="12" cy="15" r="6.5"/></svg>`,
 lock:(c='#fff',s=90)=>`<svg class="ico" width="${s}" height="${s*1.15}" viewBox="0 0 24 28"><path class="shk" d="M7 12V8a5 5 0 0 1 10 0v4" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/><rect x="4" y="12" width="16" height="13" rx="3.5" fill="${c}"/><circle cx="12" cy="18" r="2" fill="#F47B3B"/></svg>`,
 card:(s=220)=>`<svg class="ico" width="${s}" height="${s*0.63}" viewBox="0 0 100 63"><defs><linearGradient id="cg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#F7975F"/><stop offset="1" stop-color="#F46344"/></linearGradient></defs><rect width="100" height="63" rx="9" fill="url(#cg)"/><rect x="10" y="16" width="16" height="12" rx="3" fill="#FFE2A8"/><rect x="10" y="40" width="44" height="5" rx="2.5" fill="rgba(255,255,255,.7)"/><circle cx="78" cy="46" r="7" fill="rgba(255,255,255,.55)"/><circle cx="86" cy="46" r="7" fill="rgba(255,255,255,.35)"/></svg>`,
 wallet:(c='#F47B3B',s=120)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3" stroke="${c}" stroke-width="1.8"/><rect x="3.5" y="7.5" width="17.5" height="12" rx="3" fill="${c}"/><rect x="15" y="11.5" width="6" height="4" rx="2" fill="#FFE2A8"/></svg>`,
 coin:(s=34)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#8A4B12" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M8.5 9.5c0-1.4 1.6-2.5 3.5-2.5s3.5 1 3.5 2.3c0 3-7 1.6-7 5 0 1.4 1.6 2.5 3.5 2.5s3.5-1.1 3.5-2.5"/></svg>`,
 play:(c='#fff',s=40)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M8 5v14l11-7z"/></svg>`,
 doc:(s=120)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="3" fill="#F47B3B"/><rect x="7.5" y="7" width="9" height="2" rx="1" fill="#fff"/><rect x="7.5" y="11" width="9" height="2" rx="1" fill="rgba(255,255,255,.75)"/><rect x="7.5" y="15" width="6" height="2" rx="1" fill="rgba(255,255,255,.55)"/></svg>`,
 bell:(c='#fff',s=34)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zM9.5 18.5a2.5 2.5 0 0 0 5 0z"/></svg>`,
};
const AVC=['#7AA7E0','#F7975F','#8FD1B5','#C9A2E8','#F2A33A'];
const avatar=(i,s)=>`<div class="av" style="width:${s}px;height:${s}px;background:linear-gradient(140deg,${AVC[i%5]},${AVC[(i+2)%5]})">${I.user('rgba(255,255,255,.95)',s*0.62)}</div>`;
const stars=n=>`<div class="stars">${Array.from({length:5},(_,k)=>I.star(k<n?'#F2A33A':'#3A4559',18)).join('')}</div>`;

// ---------- build phones ----------
const world=document.getElementById('world');
function mkPhone(id){const p=$(`<div class="phone" id="${id}"><div class="scr"><div class="notch"></div><div class="shine"></div></div></div>`);world.appendChild(p);return p;}
const A=mkPhone('A'), C=mkPhone('C');
const As=A.querySelector('.scr'), Cs=C.querySelector('.scr');
// A: coach list
const Alist=$(`<div class="layer" id="Alist">
 <div class="row" style="margin-bottom:26px">${avatar(0,54)}<div class="card" style="flex:1;height:54px;border-radius:30px;display:flex;align-items:center;padding:0 18px"><div class="bar" style="width:60%"></div></div></div>
 ${[1,2,3].map(i=>`<div class="card coachcard" style="padding:20px;margin-bottom:18px;display:flex;gap:18px;align-items:center;border:3px solid transparent">
   ${avatar(i,84)}<div style="flex:1"><div class="bar l" style="width:${[70,85,60][i-1]}%;margin-bottom:12px"></div><div class="bar" style="width:${[45,55,40][i-1]}%;margin-bottom:12px"></div>${stars([4,5,4][i-1])}</div></div>`).join('')}
 <div class="btn" id="reqBtn" style="position:absolute;left:40px;right:40px;bottom:46px;height:96px;gap:16px">${I.send('#fff',46)}</div>
</div>`); As.appendChild(Alist);
// A: plan (locked/unlocked)
const planRows=(big)=>[['push','3×12'],['dumb','4×10'],['kettle','3×15'],['run','20′']].map(([ic,ch],k)=>`<div class="card prow" style="padding:${big?22:16}px;margin-bottom:${big?18:14}px;display:flex;align-items:center;gap:${big?20:14}px">
   <div style="width:${big?84:66}px;height:${big?84:66}px;border-radius:22px;background:rgba(244,123,59,.14);display:flex;align-items:center;justify-content:center">${I[ic]('#F47B3B',big?52:40)}</div>
   <div style="flex:1"><div class="bar l" style="width:${[70,60,75,55][k]}%;margin-bottom:12px"></div><div class="bar" style="width:${[40,50,35,45][k]}%"></div></div>
   <span class="chip" style="${big?'':'font-size:22px;padding:4px 12px'}">${ch}</span></div>`).join('');
const days=(s)=>`<div style="display:flex;justify-content:space-between;margin-bottom:24px">${[1,0,1,0,1,0,0].map(f=>`<div style="width:${s}px;height:${s}px;border-radius:50%;background:${f?'#F47B3B':'#2A3448'};box-shadow:${f?'0 0 18px rgba(244,123,59,.6)':'none'}"></div>`).join('')}</div>`;
const Aplan=$(`<div class="layer" id="Aplan"><div id="AplanBody">${days(36)}${planRows(false)}</div>
 <div id="lockWrap" style="position:absolute;left:0;right:0;top:250px;display:flex;justify-content:center">
   <div style="width:190px;height:190px;border-radius:50%;background:rgba(244,123,59,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(244,123,59,.6)" id="lockC">${I.lock('#fff',84)}</div></div>
 <div id="paySheet" class="card" style="position:absolute;left:14px;right:14px;bottom:14px;height:400px;border-radius:40px;background:#232D40;padding:34px 28px;display:flex;flex-direction:column;align-items:center;gap:30px">
   <div style="width:70px;height:8px;border-radius:6px;background:#3A4559"></div>
   <div style="display:flex;align-items:center;gap:24px">${I.card(200)}<div class="coin" style="position:relative;margin:0;width:78px;height:78px">${I.coin(40)}</div></div>
   <div class="btn" id="payBtn" style="width:100%;height:100px">${I.check('#fff',56)}</div></div>
 <div id="playBtn" class="btn" style="position:absolute;left:50%;bottom:60px;width:120px;height:120px;margin-left:-60px;opacity:0">${I.play('#fff',54)}</div>
</div>`); As.appendChild(Aplan);
// C: home + incoming request
const Chome=$(`<div class="layer" id="Chome">
 <div class="row" style="margin-bottom:26px">${avatar(4,54)}<div class="card" style="flex:1;height:54px;border-radius:30px"></div></div>
 <div class="card" style="height:150px;margin-bottom:18px;padding:22px"><div class="bar l" style="width:50%;margin-bottom:16px"></div><div style="display:flex;gap:10px;align-items:flex-end;height:60px">${[30,45,38,60,52,70,64].map(h=>`<div style="flex:1;height:${h}px;border-radius:8px;background:#2E394D"></div>`).join('')}</div></div>
 <div class="card" id="reqCard" style="padding:20px;display:flex;gap:18px;align-items:center;border:3px solid #F47B3B;box-shadow:0 0 40px rgba(244,123,59,.35)">
   ${avatar(1,84)}<div style="flex:1"><div class="bar l" style="width:70%;margin-bottom:12px"></div><div class="bar" style="width:45%"></div></div>
   <div style="width:44px;height:44px;border-radius:50%;background:#F47B3B;display:flex;align-items:center;justify-content:center">${I.bell('#fff',26)}</div></div>
</div>`); Cs.appendChild(Chome);
// C: wallet
const Cwallet=$(`<div class="layer" id="Cwallet">
 <div id="notif" class="card" style="position:absolute;left:18px;right:18px;top:70px;height:110px;border-radius:30px;background:#2A3448;display:flex;align-items:center;gap:18px;padding:0 20px;z-index:3">
   <div class="coin" style="position:relative;margin:0;width:66px;height:66px">${I.coin(34)}</div><div style="flex:1"><div class="bar l" style="width:70%;margin-bottom:12px"></div><div class="bar" style="width:40%"></div></div>
   <div style="width:52px;height:52px;border-radius:50%;background:#22C55E;display:flex;align-items:center;justify-content:center">${I.check('#fff',34)}</div></div>
 <div style="display:flex;flex-direction:column;align-items:center;margin-top:150px">
   <div id="walletIco" style="width:210px;height:210px;border-radius:60px;background:rgba(244,123,59,.12);display:flex;align-items:center;justify-content:center">${I.wallet('#F47B3B',150)}</div>
   <div id="balBar" style="width:280px;height:22px;border-radius:12px;background:#2A3448;margin-top:34px;overflow:hidden"><div id="balFill" style="height:100%;width:40%;border-radius:12px;background:linear-gradient(90deg,#F9B48C,#F47B3B)"></div></div>
   <div style="display:flex;gap:14px;align-items:flex-end;height:170px;margin-top:40px;width:300px">${[50,70,60,90,80].map((h,k)=>`<div style="flex:1;height:${h}px;border-radius:10px;background:#2E394D"></div>`).join('')}<div id="newBar" style="flex:1;height:10px;border-radius:10px;background:linear-gradient(180deg,#F7975F,#F47B3B);box-shadow:0 0 24px rgba(244,123,59,.6)"></div></div>
 </div></div>`); Cs.appendChild(Cwallet);
// C: logo screen
const Clogo=$(`<div class="layer" id="Clogo" style="background:linear-gradient(180deg,#FFFFFF,#FBF1EA);display:flex;align-items:center;justify-content:center;padding:0"><img src="logo-mark.png" style="width:230px;height:230px"></div>`); Cs.appendChild(Clogo);

// ---------- floating panels ----------
const prof=$(`<div class="panel" id="prof" style="left:110px;top:150px;width:860px;padding:44px 48px">
  <div class="row" style="gap:32px;margin-bottom:36px">${avatar(1,170)}<div style="flex:1"><div class="bar l" style="width:75%;height:20px;margin-bottom:20px"></div>
   <div class="row" style="gap:14px">${I.cal('#9FB3D9',40)}<div class="bar" style="width:120px;height:16px"></div>${I.scale('#9FB3D9',40)}<div class="bar" style="width:100px;height:16px"></div></div></div></div>
  ${[['target','#F47B3B',.72],['bolt','#F2A33A',.55],['heart','#F46344',1]].map(([ic,c,f],k)=>`<div class="row prof-row" style="margin-bottom:26px;gap:24px">
    <div style="width:76px;height:76px;border-radius:24px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center">${I[ic](c,44)}</div>
    ${k===1?`<div style="flex:1;display:flex;gap:10px">${[1,1,1,0,0].map(o=>`<div style="flex:1;height:22px;border-radius:8px;background:${o?'#F2A33A':'#3A4559'}"></div>`).join('')}</div>`
     :k===2?`<div style="flex:1;display:flex;gap:16px">${['heart','bolt'].map(()=>`<div style="width:56px;height:56px;border-radius:50%;background:rgba(34,197,94,.18);display:flex;align-items:center;justify-content:center">${I.check('#22C55E',34)}</div>`).join('')}<div class="bar" style="flex:1;height:18px;align-self:center"></div></div>`
