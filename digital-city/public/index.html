<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>شهر دیجیتال — ورود</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="logo-mark" aria-hidden="true">🏙️</div>
    <h1>شهر دیجیتال</h1>
    <p class="sub">یک شهر مشترک، بازیکن‌های واقعی. امتیاز جمع کن، بانکش کن، مغازه بزن.</p>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="tab active" data-mode="login" aria-selected="true">ورود</button>
      <button type="button" role="tab" class="tab" data-mode="register" aria-selected="false">ثبت‌نام</button>
    </div>

    <form id="auth-form" novalidate>
      <label>نام کاربری
        <input name="username" autocomplete="username" required minlength="3" maxlength="20" placeholder="مثلاً sajad_99">
      </label>
      <label>رمز عبور
        <input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="72" placeholder="حداقل ۸ کاراکتر">
      </label>
      <label class="only-register" hidden>تکرار رمز عبور
        <input name="password2" type="password" autocomplete="new-password" maxlength="72">
      </label>
      <p class="form-error" role="alert" hidden></p>
      <button type="submit" class="btn primary wide">ورود به شهر</button>
    </form>

    <ul class="rules">
      <li>⚡ امتیاز «روی هوا» با دویدن، پریدن از مانع و مأموریت جمع می‌شه.</li>
      <li>🏦 تا وقتی در <b>گلوبانک</b> واریزش نکنی، اگه شکست بخوری مال برنده می‌شه.</li>
      <li>🏪 با ۳۰۰ فیت‌کوین بانکی مغازه‌ی خودت رو بخر و محصول بفروش.</li>
    </ul>
  </main>
</body>
</html>
