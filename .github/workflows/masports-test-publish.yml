# One-off test requested by the owner: publish a short "hello" post on masports.ir.
# Runs only when this file itself is pushed.
name: masports test publish
on:
  push:
    paths:
      - ".github/workflows/masports-test-publish.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Login check and test post
        env:
          WP_URL: https://masports.ir
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, urllib.request, urllib.error, urllib.parse
          base = os.environ["WP_URL"]
          tok = base64.b64encode(f"{os.environ['WP_USER']}:{os.environ['WP_APP_PASSWORD']}".encode()).decode()
          H = {"Authorization": f"Basic {tok}", "X-Authorization": f"Basic {tok}", "Content-Type": "application/json; charset=utf-8", "User-Agent": "komak-morabi-publisher/1.0"}
          def call(method, route, data=None, **q):
              q["rest_route"] = route
              req = urllib.request.Request(base + "/?" + urllib.parse.urlencode(q), method=method, headers=H,
                                           data=json.dumps(data).encode() if data else None)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return r.status, json.loads(r.read() or "null")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors="replace")[:400]
          code, me = call("GET", "/wp/v2/users/me", context="edit")
          print("REST login with real secrets:", code, me if code != 200 else "OK")
          print("WP_USER length:", len(os.environ["WP_USER"]), "| WP_APP_PASSWORD length:", len(os.environ["WP_APP_PASSWORD"]))
          bad = base64.b64encode(b"nobody-test:wrong pass word").decode()
          r = urllib.request.Request(base + "/?rest_route=/wp/v2/users/me", headers={**H, "Authorization": f"Basic {bad}", "X-Authorization": f"Basic {bad}"})
          try: urllib.request.urlopen(r, timeout=60)
          except urllib.error.HTTPError as e: print("REST login with WRONG password (comparison):", e.code, e.read().decode(errors="replace")[:200])
          if code == 200:
              code, post = call("POST", "/wp/v2/posts", {"title": "سلام",
                  "content": "<p>سلام، مقاله منتشر شد.</p><p>این یک نوشتهٔ آزمایشی برای بررسی انتشار خودکار است.</p>",
                  "status": "publish"})
              print("REST publish:", code, post.get("link") if isinstance(post, dict) else post)
              sys.exit(0 if code in (200, 201) else 1)
          # Fallback: XML-RPC carries the credentials in the request body, so a stripped
          # Authorization header doesn't matter. Application passwords work here too.
          import xmlrpc.client
          class UA(xmlrpc.client.SafeTransport):
              user_agent = "komak-morabi-publisher/1.0"
          rpc = xmlrpc.client.ServerProxy(base + "/xmlrpc.php", transport=UA())
          user, pw = os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"]
          try:
              blogs = rpc.wp.getUsersBlogs(user, pw)
              print("XML-RPC login OK:", [b.get("blogName") for b in blogs])
              pid = rpc.wp.newPost(0, user, pw, {"post_type": "post", "post_status": "publish",
                  "post_title": "سلام",
                  "post_content": "<p>سلام، مقاله منتشر شد.</p><p>این یک نوشتهٔ آزمایشی برای بررسی انتشار خودکار است.</p>"})
              link = rpc.wp.getPost(0, user, pw, int(pid), ["link", "post_status"])
              print("XML-RPC publish OK: id", pid, link)
          except xmlrpc.client.Fault as f:
              print("::error::XML-RPC fault", f.faultCode, f.faultString); sys.exit(1)
          except Exception as e:
              print("::error::XML-RPC failed:", repr(e)[:300]); sys.exit(1)
          PY
