# Read-only diagnostics for masports.ir (no secrets, nothing is written to the site).
name: masports reachability check
on:
  push:
    paths:
      - ".github/workflows/masports-reachability.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Server type
        run: curl -sS -m 30 -I https://masports.ir/ | grep -i -E "^(server|x-powered-by|x-litespeed|platform)" || true
      - name: Login header test with a deliberately WRONG password
        run: |
          # Wrong credentials should give "incorrect_password"/"invalid_username" if WordPress sees the header,
          # and "rest_not_logged_in" if the server strips it before WordPress.
          curl -sS -m 30 -u "nobody-test:wrong pass word xxxx" "https://masports.ir/?rest_route=/wp/v2/users/me" | head -c 300; echo
          curl -sS -m 30 -u "nobody-test:wrong pass word xxxx" "https://masports.ir/wp-json/wp/v2/users/me" | head -c 300; echo
